apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "partition-tree.fullname" . }}
  labels:
    {{- include "partition-tree.labels" . | nindent 4 }}
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "partition-tree.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "partition-tree.selectorLabels" . | nindent 8 }}
        control-plane: controller-manager
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "partition-tree.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: manager
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - "--leader-elect"
            - "--health-probe-bind-address=:8081"
            - "--config-namespace={{ .Release.Namespace }}"
            - "--config-name={{ .Values.config.name }}"
            {{- if hasKey .Values.metrics "enableGoogleInternalMetrics" }}
            - "--enable-google-internal-metrics={{ .Values.metrics.enableGoogleInternalMetrics }}"
            {{- end }}
            {{- if hasKey .Values.metrics "enableMetrics" }}
            - "--enable-metrics={{ .Values.metrics.enableMetrics }}"
            {{- end }}
            {{- if .Values.metrics.cardinalityLimit }}
            - "--metric-cardinality-limit={{ .Values.metrics.cardinalityLimit }}"
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - "--metrics-bind-address=:{{ .Values.metrics.port }}"
            - "--metrics-secure={{ .Values.metrics.secure }}"
            {{- end }}
            {{- if or .Values.metrics.directPush .Values.metrics.enableDirectGCPExport }}
            - "--metrics-direct-push"
            {{- else if .Values.otlp.endpoint }}
            - "--otlp-endpoint={{ .Values.otlp.endpoint }}"
            {{- end }}
            {{- if .Values.gce.endpoint }}
            - "--gce-endpoint={{ .Values.gce.endpoint }}"
            {{- end }}
            {{- if .Values.gce.useStaging }}
            - "--use-staging-endpoint"
            {{- end }}
            {{- if .Values.gce.mock }}
            - "--gce-mock"
            {{- end }}
            {{- if .Values.gce.mockFixtures }}
            - "--gce-mock-fixtures={{ .Values.gce.mockFixtures }}"
            {{- end }}
            {{- if .Values.enableTaints }}
            {{- if kindIs "bool" .Values.enableTaints }}
            - "--enable-taints"
            {{- else if kindIs "slice" .Values.enableTaints }}
            - "--enable-taints={{ join "," .Values.enableTaints }}"
            {{- else }}
            - "--enable-taints={{ .Values.enableTaints }}"
            {{- end }}
            {{- end }}
            {{- if .Values.decoupledLifecycle }}
            - "--decoupled-lifecycle"
            {{- end }}
            {{- if .Values.tpuAllocatableReadiness }}
            - "--enable-tpu-allocatable-readiness"
            {{- end }}
            {{- if .Values.enableHTTP2 }}
            - "--enable-http2"
            {{- end }}
            {{- if .Values.debug.enabled }}
            - "--zap-devel"
            - "--zap-log-level={{ .Values.debug.level }}"
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
