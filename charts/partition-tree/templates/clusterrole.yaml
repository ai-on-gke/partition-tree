# Manager ClusterRole — generated by controller-gen from RBAC markers.
# Ported from config/rbac/role.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "partition-tree.fullname" . }}-manager
  labels:
    {{- include "partition-tree.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - nodes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - partition.tpu.google.com
  resources:
  - partitiontrees
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - partition.tpu.google.com
  resources:
  - partitiontrees/finalizers
  verbs:
  - update
- apiGroups:
  - partition.tpu.google.com
  resources:
  - partitiontrees/status
  verbs:
  - get
  - patch
  - update
