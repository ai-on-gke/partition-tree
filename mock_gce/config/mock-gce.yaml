apiVersion: v1
kind: Namespace
metadata:
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-gce
  namespace: system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-gce
  template:
    metadata:
      labels:
        app: mock-gce
    spec:
      containers:
      - name: mock-gce
        image: us-central1-docker.pkg.dev/YOUR_PROJECT/partitiontree/mock-gce-server:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mock-gce-service
  namespace: system
spec:
  selector:
    app: mock-gce
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
