apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: partition
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: partition
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: partition
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: partition
    spec:
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --otlp-endpoint=opentelemetry-collector.gke-managed-otel.svc.cluster.local:4317
        image: controller:latest
        imagePullPolicy: Always
        name: manager
        ports: []
        env:
          # The loader reads --config-namespace, which defaults to
          # $POD_NAMESPACE so the controller picks up the ConfigMap in
          # whatever namespace it is deployed into. Without this the
          # loader falls back to the hard-coded "default" namespace,
          # which will almost never be right.
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # Tuned for up to 3,456 MIGs / 55,296 nodes: with
        # StripNodeForCache (~3.13 KB/node), that fleet uses ~275 MiB live heap
        # (~580 MiB peak RSS at GOGC=100); 1Gi limit gives ~1.8x headroom.
        resources:
          limits:
            memory: 1Gi
          requests:
            memory: 256Mi
        volumeMounts: []
      volumes: []
      nodeSelector:
        cloud.google.com/gke-nodepool: cpu-pool
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
