# PartitionTree is a controller-managed resource.
#
# DO NOT apply this file directly. The controller creates a PartitionTree
# per GKE node pool the first time it sees a node that matches the TPU
# topology filter (see internal/controller/node.go for the exact
# filter). This file only documents the expected runtime shape of the CR
# for reference — every field below is written by the controller, not
# the operator.
apiVersion: partition.tpu.google.com/v1beta1
kind: PartitionTree
metadata:
  name: my-tpu-pool
  annotations:
    tpu.gke.io/mig-name: projects/1234567890/zones/us-central2-b/instanceGroupManagers/my-tpu-pool-mig
  finalizers:
    - partition.tpu.google.com/finalizer
status:
  acceleratorType: v7x
  root:
    partitionId: my-tpu-pool-root
    topology: 4x4x4
    state: Healthy
    occupancy: Empty
    childPartitions:
      - partitionId: my-tpu-pool-root-0
        topology: 2x2x1
        state: Healthy
        occupancy: Empty
        nodeNames:
          - gke-my-tpu-pool-0-xxxx
        conditions:
          - type: NodeReady
            status: "True"
            reason: NodesReady
            message: all expected nodes are Ready
            lastTransitionTime: "2026-04-11T12:00:00Z"
  summary:
    topologies:
      - topology: 2x2x1
        healthy: 1
        empty: 1
      - topology: 4x4x4
        healthy: 1
        empty: 1
  conditions:
    - type: Synced
      status: "True"
      reason: InSync
      message: last successful poll at 2026-04-11T12:00:00Z
      lastTransitionTime: "2026-04-11T12:00:00Z"
  lastPollTime: "2026-04-11T12:00:00Z"
