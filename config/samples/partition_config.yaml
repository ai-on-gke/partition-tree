# Runtime configuration for the PartitionTree controller.
#
# The controller watches exactly one ConfigMap — resolved at startup
# from --config-namespace / --config-name (defaulting to the namespace
# read from $POD_NAMESPACE and name "partition-config"). Edits to
# this ConfigMap are hot-reloaded: every existing PartitionTree CR is
# nudged through the reconciler at the new cadence on next event.
#
# If this ConfigMap is absent the controller falls back to the
# built-in defaults (1s polling, 100ms jitter, 15s sync timeout,
# 1s→30s backoff, 50 QPS rate limit, 8 concurrent reconciles).
# Invalid updates are rejected and the previous good config stays in
# effect — the controller never silently runs with a broken config.
# Note: the "config" name here becomes "partition-config" after
# config/default/kustomization.yaml applies its namePrefix, which
# matches the manager's --config-name default. The namespace is
# rewritten to "partition-system" by the same kustomization.
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  config.yaml: |
    polling:
      interval: 1s
      jitter: 100ms
    syncTimeout: 15s
    retry:
      initialBackoff: 1s
      maxBackoff: 30s
      multiplier: 2.0
    # rateLimit and concurrency are read once at startup and are NOT
    # hot-reloaded. Changing them requires a controller restart.
    rateLimit:
      qps: 50
      burst: 50
    concurrency:
      maxReconciles: 8
    taints:
      nodePropagation:
        excludedPrefixes:
        - "google.com/tpu"
