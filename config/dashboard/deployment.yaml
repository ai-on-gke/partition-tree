apiVersion: apps/v1
kind: Deployment
metadata:
  name: ptree-dashboard
  namespace: system
  labels:
    app.kubernetes.io/name: partition-tree-dashboard
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: partition-tree-dashboard
  replicas: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: partition-tree-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dashboard
        image: ptree-dashboard:latest
        imagePullPolicy: Always
        args:
          - --port=8080
          - --auth-enabled=true
        ports:
          - containerPort: 8080
            name: http
            protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      serviceAccountName: ptree-dashboard
      terminationGracePeriodSeconds: 10
