apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: partition-tree-dashboard
    app.kubernetes.io/managed-by: kustomize
  name: ptree-dashboard-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: ptree-dashboard
  namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: partition-tree-dashboard
    app.kubernetes.io/managed-by: kustomize
  name: ptree-dashboard-reader-role
rules:
- apiGroups:
  - partition.tpu.google.com
  resources:
  - partitiontrees
  - partitiontrees/status
  verbs:
  - get
  - list
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/name: partition-tree-dashboard
    app.kubernetes.io/managed-by: kustomize
  name: ptree-dashboard-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ptree-dashboard-reader-role
subjects:
- kind: ServiceAccount
  name: ptree-dashboard
  namespace: system
