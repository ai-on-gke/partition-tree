# Patch the controller-manager to (a) run with --gce-mock + the fixture
# path, and (b) mount the gce-mock-fixtures ConfigMap at /etc/gce-mock.
# Strategic merge — args/volumes/volumeMounts are replaced wholesale,
# which is fine because the e2e overlay owns the manager spec entirely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        - --otlp-endpoint=
        - --gce-mock
        - --gce-mock-fixtures=/etc/gce-mock/fixtures.yaml
        - --enable-taints
        - --kube-api-qps=2000
        - --kube-api-burst=4000
        volumeMounts:
        - name: gce-mock-fixtures
          mountPath: /etc/gce-mock
          readOnly: true
      volumes:
      - name: gce-mock-fixtures
        configMap:
          # The configMapGenerator runs in this overlay, which sets no
          # namePrefix, so the ConfigMap lands in the cluster as
          # "gce-mock-fixtures" verbatim. The base's namePrefix only
          # applies to base resources.
          name: gce-mock-fixtures
