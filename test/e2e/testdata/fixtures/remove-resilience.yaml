entries:
- key: 1234/us-central1-a/healthy-mig
  response:
    entries:
    - partitionId: root
      parentId: ""
      topology: 2x2
      state: Healthy
    - partitionId: leaf
      parentId: root
      topology: 2x2
      state: Healthy
- key: 1234/us-central1-a/incomplete-mig
  response:
    entries:
    - partitionId: root
      parentId: ""
      topology: 4x4x4
      state: Incomplete
- key: 1234/us-central1-a/occupied-mig
  response:
    entries:
    - partitionId: root
      parentId: ""
      topology: 2x2
      state: Healthy
    - partitionId: leaf
      parentId: root
      topology: 2x2
      state: Healthy
      sliceId: "slice-abc-123"
- key: 1234/us-central1-a/multi-pool-mig
  response:
    entries:
    - partitionId: root
      parentId: ""
      topology: 4x4x4
      state: Healthy
    - partitionId: leaf
      parentId: root
      topology: 2x2
      state: Healthy
